[build-system]
requires = ["setuptools>=64", "wheel", "pybind11>=2.11"]
build-backend = "setuptools.build_meta"

[project]
name = "fxquant"
version = "0.1.0"
description = "Machine-learning forex market analysis and trade advisory system (Python + C++)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
live = ["yfinance>=0.2.40"]
dev = ["pytest>=7"]

[project.scripts]
fxquant = "fxquant.cli:main"

[tool.setuptools]
packages = ["fxquant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
